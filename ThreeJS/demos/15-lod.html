<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>15 LOD — IGWT Three.js</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:40rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="hud">
    <strong>15 — LOD</strong><br/>
    Dolly out. High / mid / low sphere segments swap.
    <div><a href="14-resize.html">prev</a> · <a href="16-custom-buffer.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1e);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 1, 6);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.2));
    const mat = new THREE.MeshStandardMaterial({ color: 0xe85d3a, roughness: 0.4, flatShading: true });
    const lod = new THREE.LOD();
    lod.addLevel(new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), mat), 0);
    lod.addLevel(new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat.clone()), 8);
    lod.addLevel(new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat.clone()), 16);
    scene.add(lod);
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    function frame() {
      resize();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
