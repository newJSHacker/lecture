<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>02 orbit — IGWT Three.js</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:40rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/jsm/"}}</script>
</head>
<body>
  <div class="hud">
    <strong>02 — OrbitControls</strong><br/>
    Drag to orbit, wheel to dolly. Camera looks at the origin.
    <div><a href="01-hello-cube.html">prev</a> · <a href="03-lights-shadows.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1e);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(3, 2, 4);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
    scene.add(new THREE.DirectionalLight(0xffffff, 0.8)).position.set(3, 5, 2);
    scene.add(new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.7, 0.24, 96, 16),
      new THREE.MeshStandardMaterial({ color: 0x4a8fd4, roughness: 0.35, metalness: 0.2 })
    ));
    scene.add(new THREE.GridHelper(8, 8, 0x444, 0x2a2a2a));
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    function frame() {
      resize();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
