<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>09 ShaderMaterial — IGWT Three.js</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:40rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="hud">
    <strong>09 — ShaderMaterial</strong><br/>
    Three provides <code>projectionMatrix</code> / <code>normalMatrix</code>. Update <code>u_time</code>.
    <div><a href="08-instancing.html">prev</a> · <a href="10-gltf-pattern.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1e);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(2.4, 1.4, 3);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        u_time: { value: 0 },
        u_color: { value: new THREE.Color(0xe85d3a) },
      },
      vertexShader: `
        varying vec3 v_n; varying vec2 v_uv;
        void main() {
          v_n = normalize(normalMatrix * normal);
          v_uv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float u_time; uniform vec3 u_color;
        varying vec3 v_n; varying vec2 v_uv;
        void main() {
          float l = max(dot(normalize(v_n), normalize(vec3(0.4,1.0,0.3))), 0.12);
          float bands = floor((v_uv.y + u_time * 0.15) * 10.0) / 10.0;
          gl_FragColor = vec4(u_color * l * (0.55 + 0.45 * bands), 1.0);
        }`,
    });
    scene.add(new THREE.Mesh(new THREE.TorusKnotGeometry(0.7, 0.24, 100, 16), mat));
    const clock = new THREE.Clock();
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    function frame() {
      resize();
      mat.uniforms.u_time.value = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
