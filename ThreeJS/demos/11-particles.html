<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>11 particles — IGWT Three.js</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:40rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="hud">
    <strong>11 — Points</strong><br/>
    BufferAttribute positions, additive PointsMaterial.
    <div><a href="10-gltf-pattern.html">prev</a> · <a href="12-fog-helpers.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07070c);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 1, 6);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    const n = 1500;
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 6;
      pos[i * 3 + 1] = Math.random() * 4;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 6;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const points = new THREE.Points(
      geo,
      new THREE.PointsMaterial({ color: 0xff8844, size: 0.06, transparent: true, opacity: 0.85, depthWrite: false })
    );
    scene.add(points);
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    function frame(t) {
      resize();
      const arr = geo.attributes.position.array;
      for (let i = 0; i < n; i++) {
        arr[i * 3 + 1] += 0.006;
        if (arr[i * 3 + 1] > 4) arr[i * 3 + 1] = 0;
      }
      geo.attributes.position.needsUpdate = true;
      points.rotation.y = t * 0.00005;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
