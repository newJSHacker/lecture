<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>08 instancing — IGWT Three.js</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:40rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/jsm/"}}</script>
</head>
<body>
  <div class="hud">
    <strong>08 — InstancedMesh</strong><br/>
    400 cubes, one draw. Watch <code>renderer.info.render.calls</code>.
    <div><a href="07-raycaster.html">prev</a> · <a href="09-shader-material.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1e);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 12, 18);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223, 1.1));
    const n = 400;
    const mesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshStandardMaterial({ roughness: 0.4 }),
      n
    );
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    for (let i = 0; i < n; i++) {
      dummy.position.set((i % 20) - 9.5, 0, Math.floor(i / 20) - 9.5);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      mesh.setColorAt(i, color.setHSL(i / n, 0.55, 0.5));
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    const hud = document.querySelector(".hud");
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    function frame(t) {
      resize();
      dummy.rotation.y = t * 0.0004;
      for (let i = 0; i < n; i++) {
        dummy.position.set((i % 20) - 9.5, 0.15 * Math.sin(t * 0.002 + i), Math.floor(i / 20) - 9.5);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      controls.update();
      renderer.render(scene, camera);
      hud.dataset.calls = renderer.info.render.calls;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
