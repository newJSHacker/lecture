<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>02 Checkerboard</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>02 — Checkerboard framebuffer</h1>
  <p class="hint">Cell size 16. Bounds-checked putPixel. CSS size may differ from backing store — this canvas is not stretched.</p>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      draw(img) {
        const cell = 16;
        for (let y = 0; y < img.height; y++) {
          for (let x = 0; x < img.width; x++) {
            const on = ((x / cell | 0) + (y / cell | 0)) & 1;
            CG.putPixel(img, x, y, on ? 240 : 36, on ? 236 : 36, on ? 220 : 42);
          }
        }
      },
      status(s) { return "cell = 16\nt = " + s.t.toFixed(2); }
    });
  </script>
</body>
</html>
