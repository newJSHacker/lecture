<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>10 lookAt</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>10 — lookAt camera</h1>
  <p class="hint">V * eye ≈ 0. Camera looks −Z in view space. Moving the camera left moves the world right on screen.</p>
  <label>eye x <input id="ex" type="range" min="-4" max="4" step="0.05" value="0"/></label>
  <label>eye y <input id="ey" type="range" min="0" max="4" step="0.05" value="1.2"/></label>
  <label>eye z <input id="ez" type="range" min="2" max="8" step="0.05" value="5"/></label>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    function drawMesh(img, PVM, color) {
      const depth = CG.makeDepth(img.width, img.height);
      CG.cubeMesh().forEach((tri) => {
        const pts = CG.projectTri(tri, PVM, img.width, img.height);
        if (pts) CG.fillTriangleDepth(img, depth, pts[0], pts[1], pts[2], color, color, color);
      });
    }
    Raster.boot({
      draw(img) {
        CG.clear(img, 18, 18, 22);
        const eye = { x:+document.getElementById("ex").value, y:+document.getElementById("ey").value, z:+document.getElementById("ez").value };
        const V = CG.m4lookAt(eye, {x:0,y:0,z:0}, {x:0,y:1,z:0});
        const P = CG.m4perspective(0.8, img.width/img.height, 0.2, 40);
        const M = CG.m4rotateY(0.4);
        drawMesh(img, CG.m4mul(P, CG.m4mul(V, M)), [80, 160, 220]);
        CG.drawWorldAxes(img, CG.m4mul(P, V), 1.6);
        img._eye = eye; img._V = V;
      },
      status(s) {
        const eye = { x:+document.getElementById("ex").value, y:+document.getElementById("ey").value, z:+document.getElementById("ez").value };
        const V = CG.m4lookAt(eye, {x:0,y:0,z:0}, {x:0,y:1,z:0});
        const ve = CG.m4mulVec(V, eye.x, eye.y, eye.z, 1);
        return "V * eye = (" + ve.x.toFixed(3) + ", " + ve.y.toFixed(3) + ", " + ve.z.toFixed(3) + ")\nshould be ~ 0";
      }
    });
  </script>
</body>
</html>
