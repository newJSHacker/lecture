<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>05 Quad</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>05 — Quad = two triangles</h1>
  <p class="hint">Shared edge. If the fill rule is inconsistent you get a crack. We test pixel centers.</p>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      draw(img) {
        CG.clear(img, 24, 24, 28);
        const a = { x: 140, y: 80 }, b = { x: 500, y: 90 }, c = { x: 520, y: 320 }, d = { x: 120, y: 310 };
        CG.fillTriangle(img, a, b, c, [40, 90, 180], [40, 90, 180], [180, 200, 240]);
        CG.fillTriangle(img, a, c, d, [180, 90, 40], [180, 200, 240], [180, 90, 40]);
      },
      status() { return "two triangles, diagonal a→c\ncentroid mix should be smooth if colors match on the shared edge"; }
    });
  </script>
</body>
</html>
