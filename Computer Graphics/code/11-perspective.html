<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>11 Perspective</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>11 — Perspective vs ortho</h1>
  <p class="hint">Smaller fov → larger cube. Ortho has no foreshortening. near &gt; 0.</p>
  <button data-toggle="ortho">Toggle ortho</button>
  <label>fov (rad) <input id="fov" type="range" min="0.35" max="1.4" step="0.01" value="0.8"/></label>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      state: { ortho: false },
      draw(img, s) {
        CG.clear(img, 18, 18, 22);
        const V = CG.m4lookAt({x:2.2,y:1.6,z:4.2},{x:0,y:0,z:0},{x:0,y:1,z:0});
        const aspect = img.width / img.height;
        const P = s.ortho
          ? CG.m4ortho(-3, 3, -3/aspect, 3/aspect, 0.2, 40)
          : CG.m4perspective(+document.getElementById("fov").value, aspect, 0.2, 40);
        const M = CG.m4mul(CG.m4rotateY(s.t * 0.4), CG.m4rotateX(0.4));
        const PVM = CG.m4mul(P, CG.m4mul(V, M));
        const depth = CG.makeDepth(img.width, img.height);
        CG.cubeMesh().forEach((tri) => {
          const pts = CG.projectTri(tri, PVM, img.width, img.height);
          const col = [(tri.n.x*0.5+0.5)*255, (tri.n.y*0.5+0.5)*255, (tri.n.z*0.5+0.5)*255];
          if (pts) CG.fillTriangleDepth(img, depth, pts[0], pts[1], pts[2], col, col, col);
        });
      },
      status(s) { return (s.ortho ? "ortho" : "perspective") + "  fov = " + document.getElementById("fov").value + "\nfaces colored by normal (debug)"; }
    });
  </script>
</body>
</html>
