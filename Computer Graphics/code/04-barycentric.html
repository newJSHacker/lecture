<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>04 Barycentric</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>04 — Barycentric triangle</h1>
  <p class="hint">RGB = (α, β, γ). Test at pixel centers (x+0.5, y+0.5). Drag conceptually: vertices are animated.</p>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      draw(img, s) {
        CG.clear(img, 24, 24, 28);
        const a = { x: 120, y: 320 };
        const b = { x: 520, y: 300 };
        const c = { x: 320 + Math.cos(s.t) * 40, y: 70 };
        CG.fillTriangle(img, a, b, c, [220, 40, 40], [40, 200, 60], [50, 90, 230]);
        const w = CG.barycentric({ x: 320, y: 220 }, a, b, c);
        s._w = w;
      },
      status(s) {
        const w = s._w;
        return w ? "sample (320,220)  α=" + w.a.toFixed(3) + "  β=" + w.b.toFixed(3) + "  γ=" + w.g.toFixed(3) + "\nsum = " + (w.a+w.b+w.g).toFixed(4) : "degenerate";
      }
    });
  </script>
</body>
</html>
