<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>07 mat4 order</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>07 — T R vs R T</h1>
  <p class="hint">Column vectors: the matrix nearest the point acts first. T*R rotates about the origin then translates. R*T orbits.</p>
  <button data-toggle="swap">Toggle T*R / R*T</button>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      state: { swap: false },
      draw(img, s) {
        CG.clear(img, 24, 24, 28);
        const T = CG.m4translate(0.9, 0, 0);
        const R = CG.m4rotateZ(s.t);
        const M = s.swap ? CG.m4mul(R, T) : CG.m4mul(T, R);
        const V = CG.m4lookAt({x:0,y:0,z:4},{x:0,y:0,z:0},{x:0,y:1,z:0});
        const P = CG.m4ortho(-2.2, 2.2, -1.4, 1.4, 0.1, 20);
        const PVM = CG.m4mul(P, CG.m4mul(V, M));
        const a = {x:-0.25,y:-0.15,z:0}, b = {x:0.25,y:-0.15,z:0}, c = {x:0,y:0.25,z:0};
        const pa = CG.projectTri({ p:[ [a.x,a.y,a.z],[b.x,b.y,b.z],[c.x,c.y,c.z] ], uv:[[0,0],[1,0],[0,1]] }, PVM, img.width, img.height);
        if (pa) CG.fillTriangle(img, pa[0], pa[1], pa[2], [220,80,60], [80,200,90], [70,110,220]);
        CG.drawWorldAxes(img, CG.m4mul(P, V), 1.2);
      },
      status(s) { return s.swap ? "R * T * p  (orbit origin)" : "T * R * p  (spin then offset)"; }
    });
  </script>
</body>
</html>
