<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>12 Z-buffer</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>12 — Z-buffer cube</h1>
  <p class="hint">Disable depth and painter order wins. y-flip is in viewport(). Canvas y grows down.</p>
  <button data-toggle="depth">Toggle depth</button>
  <button data-toggle="zvis">Toggle z-visualize</button>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      state: { depth: true, zvis: false },
      draw(img, s) {
        CG.clear(img, 18, 18, 22);
        const V = CG.m4lookAt({x:2,y:1.5,z:4},{x:0,y:0,z:0},{x:0,y:1,z:0});
        const P = CG.m4perspective(0.8, img.width/img.height, 0.2, 40);
        const M = CG.m4mul(CG.m4rotateY(s.t * 0.5), CG.m4rotateX(0.35));
        const PVM = CG.m4mul(P, CG.m4mul(V, M));
        const depth = CG.makeDepth(img.width, img.height);
        const tris = CG.cubeMesh();
        if (!s.depth) tris.reverse();
        tris.forEach((tri, i) => {
          const pts = CG.projectTri(tri, PVM, img.width, img.height);
          if (!pts) return;
          const col = s.zvis ? [120,120,120] : [[220,70,70],[70,200,90],[70,110,220],[230,200,60],[200,80,200],[80,200,200]][i >> 1];
          if (s.depth) CG.fillTriangleDepth(img, depth, pts[0], pts[1], pts[2], col, col, col);
          else CG.fillTriangle(img, pts[0], pts[1], pts[2], col, col, col);
        });
        if (s.zvis && s.depth) {
          for (let i = 0; i < depth.length; i++) {
            const z = depth[i];
            if (z >= 1) continue;
            const g = CG.clamp((1 - z) * 255, 0, 255);
            img.data[i * 4] = g;
            img.data[i * 4 + 1] = g;
            img.data[i * 4 + 2] = g;
          }
        }
      },
      status(s) { return "depth " + s.depth + "   z-vis " + s.zvis + "\ninit depth = 1 (far). closer z wins."; }
    });
  </script>
</body>
</html>
