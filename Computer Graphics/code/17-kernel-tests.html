<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>17 Kernel tests</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>17 — Kernel unit tests</h1>
  <p class="hint">Hidden-fixture style. Students extend this file; they do not delete cases.</p>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script>
    const lines = []; let pass = 0, fail = 0;
    function assert(name, cond) {
      if (cond) { pass++; lines.push("PASS  " + name); }
      else { fail++; lines.push("FAIL  " + name); }
    }
    const i = { x:1,y:0,z:0 }, j = { x:0,y:1,z:0 }, k = { x:0,y:0,z:1 };
    assert("dot i j = 0", Math.abs(CG.vdot(i,j)) < 1e-9);
    const c = CG.vcross(i, j);
    assert("cross i j = k", Math.abs(c.x) < 1e-9 && Math.abs(c.y) < 1e-9 && Math.abs(c.z - 1) < 1e-9);
    assert("normalize 0 does not NaN", Number.isFinite(CG.vnormalize({x:0,y:0,z:0}).y));
    const T = CG.m4translate(1,2,3);
    const p = CG.m4mulVec(T, 0,0,0,1);
    assert("T(1,2,3)*origin", Math.abs(p.x-1)+Math.abs(p.y-2)+Math.abs(p.z-3) < 1e-8);
    const d = CG.m4mulVec(T, 1,0,0,0);
    assert("T does not move direction", Math.abs(d.x-1)+Math.abs(d.y)+Math.abs(d.z) < 1e-8);
    const R = CG.m4rotateY(Math.PI/2);
    const q = CG.m4mulVec(R, 1,0,0,1);
    assert("Ry(90)*(1,0,0) ~ (0,0,-1)", Math.abs(q.x)<1e-6 && Math.abs(q.y)<1e-6 && Math.abs(q.z+1)<1e-5);
    const I = CG.m4mul(T, CG.m4translate(-1,-2,-3));
    assert("T Tinv ~ I", Math.abs(I[0]-1)+Math.abs(I[5]-1)+Math.abs(I[10]-1)+Math.abs(I[12])+Math.abs(I[13])+Math.abs(I[14]) < 1e-6);
    const a = {x:0,y:0}, b = {x:2,y:0}, cpt = {x:0,y:2};
    const w0 = CG.barycentric({x:0,y:0}, a,b,cpt);
    const wc = CG.barycentric({x:2/3,y:2/3}, a,b,cpt);
    assert("bary vertex a", w0 && Math.abs(w0.a-1)<1e-6);
    assert("bary centroid ~ 1/3", wc && Math.abs(wc.a-1/3)<1e-5 && Math.abs(wc.b-1/3)<1e-5);
    const eye = {x:0,y:0,z:5};
    const V = CG.m4lookAt(eye, {x:0,y:0,z:0}, {x:0,y:1,z:0});
    const ve = CG.m4mulVec(V, eye.x, eye.y, eye.z, 1);
    assert("V*eye ~ 0", Math.hypot(ve.x, ve.y, ve.z) < 1e-5);
    const n = {x:0,y:1,z:0}, l = {x:0,y:1,z:0};
    assert("lambert facing", CG.lambert(n,l,1,0) > 0.99);
    assert("lambert back", CG.lambert(n,{x:0,y:-1,z:0},1,0) < 0.01);
    const tex = { width:2, height:2, data: new Uint8ClampedArray([255,0,0,255, 0,255,0,255, 0,0,255,255, 255,255,0,255]) };
    const sm = CG.sampleNearest(tex, 0.1, 0.1, "clamp");
    assert("sample nearest", sm[0]===255 && sm[1]===0);
    const vp = CG.viewport({x:-1,y:1,z:0}, 100, 50);
    assert("viewport top-left-ish", Math.abs(vp.x)<1e-6 && Math.abs(vp.y)<1e-6);

    document.getElementById("out").textContent = pass + " passed, " + fail + " failed\n\n" + lines.join("\n");
    document.getElementById("out").style.color = fail ? "#ffb4b4" : "#b8f0c8";
  </script>
</body>
</html>
