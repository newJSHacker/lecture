<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>01 putPixel</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>01 — putPixel / gradient</h1>
  <p class="hint">Canvas y grows down. World y will grow up; we flip in the viewport (Week 9), not here. Index = (y * width + x) * 4.</p>
  <canvas id="c" width="640" height="400"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="raster.js"></script>
  <script>
    Raster.boot({
      draw(img) {
        CG.clear(img, 20, 20, 24);
        for (let y = 0; y < img.height; y++) {
          const g = (y / (img.height - 1)) * 255;
          for (let x = 0; x < img.width; x++) CG.putPixel(img, x, y, g, 40, 80);
        }
        for (let x = 80; x < 180; x++)
          for (let y = 60; y < 140; y++) CG.putPixel(img, x, y, 220, 60, 60);
      },
      status() { return "width = 640  height = 400\ndata.length = " + (640*400*4) + "\nred box uses putPixel, not fillRect"; }
    });
  </script>
</body>
</html>
