<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>08 UV debug — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>08 — UV as color + checker</strong><br/>
    Red = U, green = V. Toggle in the fragment shader.
    <div><a href="07-orbit-camera.html">prev</a> · <a href="09-fullscreen-gradient.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec2 a_uv;
    uniform mat4 u_proj, u_view, u_model;
    out vec2 v_uv;
    void main(){
      v_uv = a_uv;
      gl_Position = u_proj * u_view * u_model * vec4(a_position, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_tex;
    uniform float u_mode;
    out vec4 outColor;
    void main(){
      vec3 uvcol = vec3(v_uv, 0.0);
      vec3 tex = texture(u_tex, v_uv).rgb;
      outColor = vec4(mix(uvcol, tex, u_mode), 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.sphere(20, 32);
    const tex = GL.checkerTexture(gl, 12, [230, 80, 70, 255], [40, 50, 70, 255]);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.uv); GL.enableAttrib(gl, 1, 2);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    const cam = GL.orbit(canvas, { dist: 3.2 });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj, false, GL.mat4Perspective(Math.PI / 3, aspect, 0.1, 50));
      gl.uniformMatrix4fv(u.u_view, false, GL.mat4LookAt(cam.eye(), [0, 0, 0], [0, 1, 0]));
      gl.uniformMatrix4fv(u.u_model, false, GL.mat4Ident());
      gl.uniform1f(u.u_mode, (Math.sin(t * 0.7) * 0.5 + 0.5) > 0.5 ? 1 : 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(u.u_tex, 0);
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
