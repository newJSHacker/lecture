<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>11 SDF ray march — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>11 — SDF ray march</strong><br/>
    Sphere + box, soft min, cheap soft shadow. Heavy: 80 steps.
    <div><a href="10-noise-fbm.html">prev</a> · <a href="12-toon-fresnel.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    const vs = `#version 300 es
    const vec2 V[3] = vec2[3](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
    void main(){ gl_Position = vec4(V[gl_VertexID], 0.0, 1.0); }`;
    const fs = `#version 300 es
    precision highp float;
    uniform vec2 u_res;
    uniform float u_time;
    out vec4 outColor;
    float sdSphere(vec3 p,float r){ return length(p)-r; }
    float sdBox(vec3 p,vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
    float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
    float map(vec3 p){
      float s = sdSphere(p - vec3(0.0, 0.55+0.12*sin(u_time), 0.0), 0.55);
      float b = sdBox(p, vec3(1.3, 0.12, 1.3));
      return smin(s, b, 0.25);
    }
    vec3 calcN(vec3 p){
      vec2 e=vec2(0.001,0.0);
      return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx)));
    }
    float march(vec3 ro, vec3 rd){
      float t=0.0;
      for(int i=0;i<72;i++){
        float d=map(ro+rd*t);
        if(d<0.001) return t;
        t+=d; if(t>30.0) break;
      }
      return -1.0;
    }
    float soft(vec3 ro, vec3 rd){
      float res=1.0, t=0.04;
      for(int i=0;i<20;i++){
        float h=map(ro+rd*t);
        res=min(res, 16.0*h/t);
        t+=clamp(h,0.03,0.2);
        if(res<0.02||t>12.0) break;
      }
      return clamp(res,0.0,1.0);
    }
    void main(){
      vec2 uv = (gl_FragCoord.xy / u_res)*2.0-1.0;
      uv.x *= u_res.x/u_res.y;
      float ang = u_time*0.25;
      vec3 ro = vec3(sin(ang)*3.2, 1.5, cos(ang)*3.2);
      vec3 ta = vec3(0.0, 0.3, 0.0);
      vec3 ww = normalize(ta-ro);
      vec3 uu = normalize(cross(ww, vec3(0,1,0)));
      vec3 vv = cross(uu, ww);
      vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.4*ww);
      float t = march(ro, rd);
      vec3 col = mix(vec3(0.08,0.1,0.14), vec3(0.35,0.45,0.6), 0.5+0.5*rd.y);
      if(t>0.0){
        vec3 p = ro+rd*t;
        vec3 N = calcN(p);
        vec3 L = normalize(vec3(0.6, 1.0, 0.3));
        float sh = soft(p+N*0.02, L);
        float nd = max(dot(N,L),0.0);
        vec3 albedo = mix(vec3(0.75,0.25,0.18), vec3(0.2,0.35,0.5), smoothstep(0.2,0.5,p.y));
        col = albedo*(0.12+0.88*nd*sh);
        col += vec3(0.8)*pow(max(dot(N, normalize(L-rd)),0.0), 48.0)*sh*0.4;
      }
      outColor = vec4(pow(col, vec3(1.0/2.2)), 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    GL.loop((_, t) => {
      GL.resize(gl);
      gl.useProgram(prog);
      gl.uniform2f(u.u_res, gl.canvas.width, gl.canvas.height);
      gl.uniform1f(u.u_time, t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
  </script>
</body>
</html>
