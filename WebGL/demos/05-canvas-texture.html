<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>05 canvas texture — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>05 — Texture from a canvas</strong><br/>
    No image files, no CORS. Checker is generated on the CPU.
    <div><a href="04-rotating-cube.html">prev</a> · <a href="06-phong-cube.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec2 a_uv;
    uniform mat4 u_proj, u_view, u_model;
    out vec2 v_uv;
    void main(){
      v_uv = a_uv;
      gl_Position = u_proj * u_view * u_model * vec4(a_position, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_tex;
    out vec4 outColor;
    void main(){ outColor = texture(u_tex, v_uv * 2.0); }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.cube();
    const tex = GL.checkerTexture(gl, 8);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.uv); GL.enableAttrib(gl, 1, 2);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj, false, GL.mat4Perspective(Math.PI / 3, aspect, 0.1, 50));
      gl.uniformMatrix4fv(u.u_view, false, GL.mat4LookAt([0, 0, 4], [0, 0, 0], [0, 1, 0]));
      gl.uniformMatrix4fv(u.u_model, false, GL.mat4Mul(GL.mat4Ry(t * 0.5), GL.mat4Rx(0.4)));
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(u.u_tex, 0);
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
