<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>18 barycentric wire — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>18 — Barycentric wireframe</strong><br/>
    One mesh. Edges from <code>fwidth</code> on barycentric coords.
    <div><a href="17-normal-colors.html">prev</a> · <a href="19-dissolve.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_bary;
    uniform mat4 u_proj,u_view,u_model;
    out vec3 v_bary;
    void main(){ v_bary=a_bary; gl_Position=u_proj*u_view*u_model*vec4(a_position,1); }`;
    const fs = `#version 300 es
    precision highp float; in vec3 v_bary; out vec4 outColor;
    void main(){
      float e=min(min(v_bary.x,v_bary.y),v_bary.z);
      float w=fwidth(e);
      float line=1.0-smoothstep(0.0,w*1.2,e);
      vec3 col=mix(vec3(0.12,0.14,0.18), vec3(0.95,0.55,0.2), line);
      outColor=vec4(col,1);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.cube();
    const pos = new Float32Array(mesh.count * 3);
    const bary = new Float32Array(mesh.count * 3);
    const B = [[1,0,0],[0,1,0],[0,0,1]];
    for (let i = 0; i < mesh.count; i++) {
      const vi = mesh.idx[i];
      pos[i*3]=mesh.pos[vi*3]; pos[i*3+1]=mesh.pos[vi*3+1]; pos[i*3+2]=mesh.pos[vi*3+2];
      const b = B[i % 3];
      bary[i*3]=b[0]; bary[i*3+1]=b[1]; bary[i*3+2]=b[2];
    }
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, bary); GL.enableAttrib(gl, 1, 3);
    });
    const cam = GL.orbit(canvas, { dist: 4 });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10,0.10,0.12,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const model = GL.mat4Mul(GL.mat4Ry(t*0.4), GL.mat4Rx(0.35));
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj,false,GL.mat4Perspective(Math.PI/3,aspect,0.1,50));
      gl.uniformMatrix4fv(u.u_view,false,GL.mat4LookAt(cam.eye(),[0,0,0],[0,1,0]));
      gl.uniformMatrix4fv(u.u_model,false,model);
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
    });
  </script>
</body>
</html>
