<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>09 fullscreen gradient — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>09 — Fullscreen triangle</strong><br/>
    <code>gl_VertexID</code>, no VBO. Color from <code>gl_FragCoord</code> and time.
    <div><a href="08-uv-debug.html">prev</a> · <a href="10-noise-fbm.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    const vs = `#version 300 es
    const vec2 V[3] = vec2[3](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
    out vec2 v_uv;
    void main(){
      vec2 p = V[gl_VertexID];
      v_uv = p * 0.5 + 0.5;
      gl_Position = vec4(p, 0.0, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform vec2 u_res;
    uniform float u_time;
    out vec4 outColor;
    void main(){
      vec2 p = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
      p.x *= u_res.x / u_res.y;
      float r = length(p);
      vec3 a = vec3(0.05, 0.08, 0.16);
      vec3 b = vec3(0.91, 0.35, 0.22);
      vec3 c = mix(a, b, 0.5 + 0.5 * sin(r * 6.0 - u_time * 2.0));
      outColor = vec4(c, 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    GL.loop((_, t) => {
      GL.resize(gl);
      gl.useProgram(prog);
      gl.uniform2f(u.u_res, gl.canvas.width, gl.canvas.height);
      gl.uniform1f(u.u_time, t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
  </script>
</body>
</html>
