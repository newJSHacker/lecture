<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>24 matcap — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>24 — Matcap</strong><br/>
    View-space normal → UV. Procedural matcap (no image file).
    <div><a href="23-gpgpu-pingpong.html">prev</a> · <a href="25-webgl1-triangle.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    uniform mat4 u_proj,u_view,u_model; uniform mat3 u_normal;
    out vec3 v_viewN;
    void main(){
      v_viewN = mat3(u_view) * (u_normal * a_normal);
      gl_Position = u_proj * u_view * u_model * vec4(a_position,1);
    }`;
    const fs = `#version 300 es
    precision highp float; in vec3 v_viewN; out vec4 outColor;
    void main(){
      vec3 vn=normalize(v_viewN);
      vec2 m=vn.xy*0.5+0.5;
      float d=length(m-0.5);
      vec3 col=mix(vec3(0.12,0.14,0.18), vec3(0.85,0.88,0.92), 1.0-smoothstep(0.1,0.72,d));
      col += vec3(1.0)*pow(max(1.0-length(m-vec2(0.34,0.68)),0.0), 10.0)*0.8;
      col += vec3(0.91,0.35,0.2)*pow(max(d-0.35,0.0),1.5)*0.35;
      outColor=vec4(col,1);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.sphere(32, 48);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.nor); GL.enableAttrib(gl, 1, 3);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    const cam = GL.orbit(canvas, { dist: 3.2, pitch: 0.2 });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10,0.10,0.12,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const model = GL.mat4Ry(t * 0.25);
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj,false,GL.mat4Perspective(Math.PI/3,aspect,0.1,50));
      gl.uniformMatrix4fv(u.u_view,false,GL.mat4LookAt(cam.eye(),[0,0,0],[0,1,0]));
      gl.uniformMatrix4fv(u.u_model,false,model);
      gl.uniformMatrix3fv(u.u_normal,false,GL.mat3Normal(model));
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
