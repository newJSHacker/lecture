<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>04 rotating cube — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>04 — Rotating cube</strong><br/>
    Depth test + cull + MVP. Disable depth in the code and watch z-fight.
    <div><a href="03-indexed-quad.html">prev</a> · <a href="05-canvas-texture.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    uniform mat4 u_proj, u_view, u_model;
    out vec3 v_n;
    void main(){
      v_n = mat3(u_model) * a_normal;
      gl_Position = u_proj * u_view * u_model * vec4(a_position, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec3 v_n;
    out vec4 outColor;
    void main(){
      vec3 n = normalize(v_n);
      float l = max(dot(n, normalize(vec3(0.4, 1.0, 0.5))), 0.15);
      outColor = vec4(vec3(0.85, 0.45, 0.25) * l, 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.cube();
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.nor); GL.enableAttrib(gl, 1, 3);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const proj = GL.mat4Perspective(Math.PI / 3, aspect, 0.1, 50);
      const view = GL.mat4LookAt([0, 0, 4], [0, 0, 0], [0, 1, 0]);
      const model = GL.mat4Mul(GL.mat4Ry(t * 0.7), GL.mat4Rx(t * 0.45));
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj, false, proj);
      gl.uniformMatrix4fv(u.u_view, false, view);
      gl.uniformMatrix4fv(u.u_model, false, model);
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
