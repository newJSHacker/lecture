<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>02 colored triangle — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>02 — Per-vertex color</strong><br/>
    Two attributes. The rasterizer interpolates varyings.
    <div><a href="01-triangle.html">prev</a> · <a href="03-indexed-quad.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const gl = GL.createGL(document.getElementById("c"));
    const vs = `#version 300 es
    layout(location=0) in vec2 a_position;
    layout(location=1) in vec3 a_color;
    out vec3 v_color;
    void main(){
      v_color = a_color;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec3 v_color;
    out vec4 outColor;
    void main(){ outColor = vec4(v_color, 1.0); }`;
    const prog = GL.program(gl, vs, fs);
    const pos = new Float32Array([0, 0.65, -0.7, -0.55, 0.7, -0.55]);
    const col = new Float32Array([1, 0.3, 0.2, 0.2, 0.8, 0.4, 0.2, 0.45, 1]);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, pos); GL.enableAttrib(gl, 0, 2);
      GL.buffer(gl, col); GL.enableAttrib(gl, 1, 3);
    });
    function draw() {
      GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(prog);
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    draw();
    window.addEventListener("resize", draw);
  </script>
</body>
</html>
