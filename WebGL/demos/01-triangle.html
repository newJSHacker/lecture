<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>01 triangle — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
    code{font-family:Consolas,monospace;font-size:12px}
  </style>
</head>
<body>
  <div class="hud">
    <strong>01 — One triangle</strong><br/>
    Clip-space positions, no matrices. If this is black, read the compile log.
    <div><a href="02-colored-triangle.html">next</a> · <a href="../00 Index.md">index</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const gl = GL.createGL(document.getElementById("c"));
    const vs = `#version 300 es
    in vec2 a_position;
    void main(){ gl_Position = vec4(a_position, 0.0, 1.0); }`;
    const fs = `#version 300 es
    precision highp float;
    out vec4 outColor;
    void main(){ outColor = vec4(0.91, 0.31, 0.22, 1.0); }`;
    const prog = GL.program(gl, vs, fs, ["a_position"]);
    const verts = new Float32Array([0, 0.65, -0.7, -0.55, 0.7, -0.55]);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, verts);
      GL.enableAttrib(gl, 0, 2);
    });
    function draw() {
      GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(prog);
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    draw();
    window.addEventListener("resize", draw);
  </script>
</body>
</html>
