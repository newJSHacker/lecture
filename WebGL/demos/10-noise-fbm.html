<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>10 noise fbm — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>10 — Hash, fBm, domain warp</strong><br/>
    May flicker. Change the warp scale in the shader.
    <div><a href="09-fullscreen-gradient.html">prev</a> · <a href="11-sdf-raymarch.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    const vs = `#version 300 es
    const vec2 V[3] = vec2[3](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
    out vec2 v_uv;
    void main(){ vec2 p=V[gl_VertexID]; v_uv=p*0.5+0.5; gl_Position=vec4(p,0,1); }`;
    const fs = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform vec2 u_res;
    uniform float u_time;
    out vec4 outColor;
    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    float valueNoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      vec2 u=f*f*(3.0-2.0*f);
      float a=hash12(i), b=hash12(i+vec2(1,0)), c=hash12(i+vec2(0,1)), d=hash12(i+vec2(1,1));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p){
      float v=0.0, a=0.5;
      mat2 m=mat2(1.6,1.2,-1.2,1.6);
      for(int i=0;i<5;i++){ v+=a*valueNoise(p); p=m*p; a*=0.5; }
      return v;
    }
    void main(){
      vec2 uv = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
      uv.x *= u_res.x / u_res.y;
      vec2 q = vec2(fbm(uv*2.0 + u_time*0.05), fbm(uv*2.0 + 4.1));
      float n = fbm(uv*2.0 + 3.5*q);
      vec3 col = mix(vec3(0.05,0.07,0.12), vec3(0.95,0.45,0.22), n);
      col = mix(col, vec3(0.2,0.55,0.7), q.x*0.35);
      outColor = vec4(col, 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    GL.loop((_, t) => {
      GL.resize(gl);
      gl.useProgram(prog);
      gl.uniform2f(u.u_res, gl.canvas.width, gl.canvas.height);
      gl.uniform1f(u.u_time, t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
  </script>
</body>
</html>
