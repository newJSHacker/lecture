<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>16 PBR direct — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>16 — Cook–Torrance (one light)</strong><br/>
    Five spheres: roughness 0.1 → 0.9, metal on the right column.
    <div><a href="15-particles.html">prev</a> · <a href="17-normal-colors.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    uniform mat4 u_proj,u_view,u_model; uniform mat3 u_normal;
    out vec3 v_pos,v_n;
    void main(){ vec4 w=u_model*vec4(a_position,1); v_pos=w.xyz; v_n=u_normal*a_normal; gl_Position=u_proj*u_view*w; }`;
    const fs = `#version 300 es
    precision highp float;
    in vec3 v_pos,v_n;
    uniform vec3 u_eye,u_light,u_albedo;
    uniform float u_metal,u_rough;
    out vec4 outColor;
    const float PI=3.14159265;
    float D_GGX(float NoH,float a){ float a2=a*a; float d=NoH*NoH*(a2-1.0)+1.0; return a2/(PI*d*d); }
    float G_Smith(float NoV,float NoL,float r){
      float k=(r+1.0)*(r+1.0)/8.0;
      return (NoV/(NoV*(1.0-k)+k)) * (NoL/(NoL*(1.0-k)+k));
    }
    vec3 F_Schlick(float VoH, vec3 F0){ return F0+(1.0-F0)*pow(1.0-VoH,5.0); }
    void main(){
      vec3 N=normalize(v_n), V=normalize(u_eye-v_pos), L=normalize(u_light-v_pos), H=normalize(V+L);
      float a=max(u_rough*u_rough,0.002);
      float NoV=max(dot(N,V),1e-4), NoL=max(dot(N,L),0.0), NoH=max(dot(N,H),0.0), VoH=max(dot(V,H),0.0);
      vec3 F0=mix(vec3(0.04), u_albedo, u_metal);
      vec3 F=F_Schlick(VoH,F0);
      vec3 spec=(D_GGX(NoH,a)*G_Smith(NoV,NoL,u_rough)*F)/max(4.0*NoV*NoL,1e-4);
      vec3 kD=(1.0-F)*(1.0-u_metal);
      vec3 light=vec3(3.0);
      vec3 col=(kD*u_albedo/PI + spec)*light*NoL;
      col += u_albedo * 0.04;
      outColor=vec4(pow(col/(col+1.0), vec3(1.0/2.2)),1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.sphere(24, 36);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.nor); GL.enableAttrib(gl, 1, 3);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    const cam = GL.orbit(canvas, { dist: 7, pitch: 0.15, target: [0, 0, 0] });
    const balls = [];
    for (let i = 0; i < 5; i++) {
      balls.push({ x: (i - 2) * 1.35, metal: 0, rough: 0.1 + i * 0.2, albedo: [0.8, 0.15, 0.1] });
      balls.push({ x: (i - 2) * 1.35, z: -1.5, metal: 1, rough: 0.1 + i * 0.2, albedo: [0.9, 0.75, 0.35] });
    }
    GL.loop(() => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.08,0.08,0.1,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const eye = cam.eye();
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj,false,GL.mat4Perspective(Math.PI/3,aspect,0.1,50));
      gl.uniformMatrix4fv(u.u_view,false,GL.mat4LookAt(eye,cam.target,[0,1,0]));
      gl.uniform3fv(u.u_eye, eye);
      gl.uniform3fv(u.u_light, [2.5, 3.0, 3.0]);
      gl.bindVertexArray(vao);
      for (const b of balls) {
        const model = GL.mat4T(b.x, 0, b.z || 0);
        gl.uniformMatrix4fv(u.u_model,false,model);
        gl.uniformMatrix3fv(u.u_normal,false,GL.mat3Normal(model));
        gl.uniform3fv(u.u_albedo, b.albedo);
        gl.uniform1f(u.u_metal, b.metal);
        gl.uniform1f(u.u_rough, b.rough);
        gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
      }
    });
  </script>
</body>
</html>
