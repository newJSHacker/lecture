<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>19 dissolve — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>19 — Noise dissolve</strong><br/>
    Cutoff + glowing edge. <code>discard</code> on the dead side.
    <div><a href="18-barycentric-wire.html">prev</a> · <a href="20-water.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    layout(location=2) in vec2 a_uv;
    uniform mat4 u_proj,u_view,u_model; uniform mat3 u_normal;
    out vec3 v_n; out vec2 v_uv;
    void main(){ v_n=u_normal*a_normal; v_uv=a_uv; gl_Position=u_proj*u_view*u_model*vec4(a_position,1); }`;
    const fs = `#version 300 es
    precision highp float;
    in vec3 v_n; in vec2 v_uv; uniform float u_cut; out vec4 outColor;
    float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
    float vn(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
      return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y); }
    void main(){
      float n=vn(v_uv*10.0);
      float d=n-u_cut;
      if(d<0.0) discard;
      float edge=1.0-smoothstep(0.0,0.06,d);
      float l=max(dot(normalize(v_n),normalize(vec3(.4,1,.3))),.15);
      vec3 albedo=vec3(0.25,0.45,0.75)*l;
      vec3 col=mix(albedo, vec3(1.0,0.45,0.1), edge);
      outColor=vec4(col,1);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.sphere(24, 36);
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.nor); GL.enableAttrib(gl, 1, 3);
      GL.buffer(gl, mesh.uv); GL.enableAttrib(gl, 2, 2);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    const cam = GL.orbit(canvas, { dist: 3.2 });
    GL.loop((_, t) => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10,0.10,0.12,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const model = GL.mat4Ident();
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj,false,GL.mat4Perspective(Math.PI/3,aspect,0.1,50));
      gl.uniformMatrix4fv(u.u_view,false,GL.mat4LookAt(cam.eye(),[0,0,0],[0,1,0]));
      gl.uniformMatrix4fv(u.u_model,false,model);
      gl.uniformMatrix3fv(u.u_normal,false,GL.mat3Normal(model));
      gl.uniform1f(u.u_cut, (Math.sin(t * 0.6) * 0.5 + 0.5) * 1.1 - 0.05);
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
