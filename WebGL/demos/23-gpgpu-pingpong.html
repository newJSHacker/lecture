<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>23 GPGPU ping-pong — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>23 — GPGPU ping-pong</strong><br/>
    State in RGBA8 (pos.xy, vel.xy). Fullscreen integrate, then POINTS sample by <code>gl_VertexID</code>.
    <div><a href="22-shadow-map.html">prev</a> · <a href="24-matcap.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    const W = 64, H = 64, N = W * H;
    function stateTex(data) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }
    const init = new Uint8Array(N * 4);
    for (let i = 0; i < N; i++) {
      init[i*4] = Math.random() * 255;
      init[i*4+1] = Math.random() * 255;
      init[i*4+2] = 100 + Math.random() * 55;
      init[i*4+3] = 100 + Math.random() * 55;
    }
    let read = stateTex(init);
    let write = stateTex(null);
    function bindFBO(tex) {
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      return fb;
    }
    let fbA = bindFBO(write);
    let fbB = bindFBO(read);

    const simVS = `#version 300 es
    const vec2 V[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));
    out vec2 v_uv; void main(){ vec2 p=V[gl_VertexID]; v_uv=p*0.5+0.5; gl_Position=vec4(p,0,1); }`;
    const simFS = `#version 300 es
    precision highp float;
    in vec2 v_uv; uniform sampler2D u_state; uniform float u_dt; out vec4 outColor;
    void main(){
      vec4 s = texture(u_state, v_uv);
      vec2 pos = s.xy * 2.0 - 1.0;
      vec2 vel = (s.zw - 0.5) * 2.0;
      vel.y -= 0.25 * u_dt;
      pos += vel * u_dt * 0.6;
      if (pos.x < -1.0 || pos.x > 1.0) { vel.x *= -0.85; pos.x = clamp(pos.x,-1.0,1.0); }
      if (pos.y < -1.0 || pos.y > 1.0) { vel.y *= -0.85; pos.y = clamp(pos.y,-1.0,1.0); }
      outColor = vec4(pos * 0.5 + 0.5, vel * 0.5 + 0.5);
    }`;
    const drawVS = `#version 300 es
    uniform sampler2D u_state; uniform int u_w,u_h;
    void main(){
      int id=gl_VertexID;
      vec2 uv=(vec2(id- (id/u_w)*u_w, id/u_w)+0.5)/vec2(u_w,u_h);
      vec2 pos=texture(u_state, uv).xy * 2.0 - 1.0;
      gl_Position=vec4(pos,0,1);
      gl_PointSize=3.0;
    }`;
    const drawFS = `#version 300 es
    precision highp float; out vec4 outColor;
    void main(){
      vec2 p=gl_PointCoord*2.0-1.0;
      if(dot(p,p)>1.0) discard;
      outColor=vec4(0.95,0.45,0.2,1);
    }`;
    const sim = GL.program(gl, simVS, simFS);
    const draw = GL.program(gl, drawVS, drawFS);
    const su = GL.uniforms(gl, sim);
    const du = GL.uniforms(gl, draw);

    GL.loop((dt) => {
      dt = Math.min(dt, 0.033);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbA);
      gl.viewport(0, 0, W, H);
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(sim);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, read);
      gl.uniform1i(su.u_state, 0);
      gl.uniform1f(su.u_dt, dt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      const tmp = read; read = write; write = tmp;
      const tf = fbA; fbA = fbB; fbB = tf;

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      GL.resize(gl);
      gl.clearColor(0.06,0.06,0.08,1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(draw);
      gl.bindTexture(gl.TEXTURE_2D, read);
      gl.uniform1i(du.u_state, 0);
      gl.uniform1i(du.u_w, W);
      gl.uniform1i(du.u_h, H);
      gl.drawArrays(gl.POINTS, 0, N);
    });
  </script>
</body>
</html>
