<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>21 sky — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>21 — Gradient sky + sun</strong><br/>
    Camera ray from UV. No mesh. Drag to look around.
    <div><a href="20-water.html">prev</a> · <a href="22-shadow-map.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    const vs = `#version 300 es
    const vec2 V[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));
    out vec2 v_uv; void main(){ vec2 p=V[gl_VertexID]; v_uv=p; gl_Position=vec4(p,0,1); }`;
    const fs = `#version 300 es
    precision highp float;
    in vec2 v_uv; uniform vec2 u_res; uniform vec3 u_fwd,u_right,u_up; out vec4 outColor;
    void main(){
      vec2 uv=v_uv; uv.x*=u_res.x/u_res.y;
      vec3 rd=normalize(u_fwd + uv.x*u_right + uv.y*u_up);
      vec3 zenith=vec3(0.15,0.35,0.75);
      vec3 hor=vec3(0.75,0.55,0.45);
      vec3 sky=mix(hor, zenith, pow(max(rd.y,0.0),0.45));
      vec3 sunDir=normalize(vec3(0.4,0.35,0.7));
      float sun=pow(max(dot(rd,sunDir),0.0), 400.0);
      float glow=pow(max(dot(rd,sunDir),0.0), 8.0);
      sky += vec3(1.0,0.85,0.5)*sun + vec3(1.0,0.5,0.2)*glow*0.25;
      if(rd.y<0.0) sky=mix(vec3(0.12,0.14,0.16), hor, 0.3);
      outColor=vec4(pow(sky,vec3(1.0/2.2)),1);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const cam = GL.orbit(canvas, { dist: 1, pitch: 0.15, yaw: 0.2 });
    GL.loop(() => {
      GL.resize(gl);
      const eye = cam.eye();
      const fwd = GL.V3.norm(GL.V3.sub(cam.target, eye));
      const right = GL.V3.norm(GL.V3.cross(fwd, [0,1,0]));
      const up = GL.V3.cross(right, fwd);
      gl.useProgram(prog);
      gl.uniform2f(u.u_res, gl.canvas.width, gl.canvas.height);
      gl.uniform3fv(u.u_fwd, fwd);
      gl.uniform3fv(u.u_right, right);
      gl.uniform3fv(u.u_up, up);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
  </script>
</body>
</html>
