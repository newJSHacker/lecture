<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>07 orbit camera — IGWT WebGL</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#e8e8e8;font:14px/1.45 "Segoe UI",sans-serif}
    canvas{width:100%;height:100%;display:block}
    .hud{position:fixed;left:12px;top:12px;max-width:38rem;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px}
    a{color:#9cf}
  </style>
</head>
<body>
  <div class="hud">
    <strong>07 — Orbit camera</strong><br/>
    Drag to orbit, wheel to dolly. <code>lookAt(eye, target, up)</code>.
    <div><a href="06-phong-cube.html">prev</a> · <a href="08-uv-debug.html">next</a></div>
  </div>
  <canvas id="c"></canvas>
  <script src="_gl.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = GL.createGL(canvas);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    const vs = `#version 300 es
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    uniform mat4 u_proj, u_view, u_model;
    out vec3 v_n;
    void main(){
      v_n = mat3(u_model) * a_normal;
      gl_Position = u_proj * u_view * u_model * vec4(a_position, 1.0);
    }`;
    const fs = `#version 300 es
    precision highp float;
    in vec3 v_n;
    out vec4 outColor;
    void main(){
      float l = max(dot(normalize(v_n), normalize(vec3(0.3,1,0.4))), 0.12);
      outColor = vec4(vec3(0.35, 0.62, 0.85) * l, 1.0);
    }`;
    const prog = GL.program(gl, vs, fs);
    const u = GL.uniforms(gl, prog);
    const mesh = GL.cube();
    const vao = GL.vao(gl, () => {
      GL.buffer(gl, mesh.pos); GL.enableAttrib(gl, 0, 3);
      GL.buffer(gl, mesh.nor); GL.enableAttrib(gl, 1, 3);
      GL.buffer(gl, mesh.idx, gl.ELEMENT_ARRAY_BUFFER);
    });
    const cam = GL.orbit(canvas, { dist: 4, yaw: 0.7, pitch: 0.35 });
    GL.loop(() => {
      const aspect = GL.resize(gl);
      gl.clearColor(0.10, 0.10, 0.12, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniformMatrix4fv(u.u_proj, false, GL.mat4Perspective(Math.PI / 3, aspect, 0.1, 50));
      gl.uniformMatrix4fv(u.u_view, false, GL.mat4LookAt(cam.eye(), cam.target, [0, 1, 0]));
      gl.uniformMatrix4fv(u.u_model, false, GL.mat4Ident());
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    });
  </script>
</body>
</html>
