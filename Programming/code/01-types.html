  <p class='hint'>Predict, then click. <code>'3'+1</code> concatenates.</p><pre id='out'></pre>

const out=document.getElementById('out');
const lines=['typeof 3 → '+typeof 3,"typeof '3' → "+typeof '3',"'3'+1 → "+('3'+1),'Number(\'3\')+1 → '+(Number('3')+1),'NaN===NaN → '+(NaN===NaN)];
