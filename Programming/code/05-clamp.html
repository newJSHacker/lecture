<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>05 — clamp lerp</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>05 — clamp lerp</h1>
  <label>x <input id='x' type='range' min='-2' max='5' step='0.05' value='1.2'></label><pre id='out'></pre>
  <script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const lerp=(a,b,t)=>a+(b-a)*t;
const x=document.getElementById('x'), out=document.getElementById('out');
function go(){ const v=+x.value; out.textContent='x='+v+'\nclamp(x,0,1)='+clamp(v,0,1)+'\nlerp(10,20,0.5)='+lerp(10,20,0.5); } x.oninput=go; go();
</script>
</body>
</html>
