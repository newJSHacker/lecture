<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>08 — search</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>08 — search</h1>
  <pre id='out'></pre>
  <script>
function lin(a,t){ let c=0; for(let i=0;i<a.length;i++){ c++; if(a[i]===t) return {i,c}; } return {i:-1,c}; }
function bin(a,t){ let lo=0,hi=a.length-1,c=0; while(lo<=hi){ c++; const m=(lo+hi)>>1; if(a[m]===t) return {i:m,c}; if(a[m]<t) lo=m+1; else hi=m-1; } return {i:-1,c}; }
const a=Array.from({length:32},(_,i)=>i*2);
document.getElementById('out').textContent='sorted even 0..62, find 20\nlinear '+JSON.stringify(lin(a,20))+'\nbinary '+JSON.stringify(bin(a,20));
</script>
</body>
</html>
