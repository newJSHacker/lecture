<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>07 — objects</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>07 — objects</h1>
  <pre id='out'></pre>
  <script>
const pts=[{x:0,y:0},{x:2,y:0},{x:2,y:2},{x:0,y:2}];
const c={x:pts.reduce((s,p)=>s+p.x,0)/pts.length, y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
document.getElementById('out').textContent=JSON.stringify({pts,c},null,2);
</script>
</body>
</html>
