<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Radiosity 2×2</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>Radiosity 2×2</h1>
  <pre id='out'></pre>
  <script>
const F=[[0,0.4],[0.4,0]]; const rho=[0.8,0.5], E=[1,0];
let B=[0,0];
const lines=[];
for(let k=0;k<12;k++){
  const n=[0,0];
  for(let i=0;i<2;i++) n[i]=E[i]+rho[i]*(F[i][0]*B[0]+F[i][1]*B[1]);
  B=n; lines.push(k+' '+B.map(x=>x.toFixed(3)).join(' '));
}
out.textContent='B_i = E_i + ρ_i Σ F_ij B_j\n'+lines.join('\n');
</script>
</body>
</html>
