<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>02 — form</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>02 — form</h1>
  <form id="f">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required/>
  <button type="submit">Log JSON</button>
</form>
<pre id="out"></pre>
  <script>
f.onsubmit=e=>{e.preventDefault(); out.textContent=JSON.stringify(Object.fromEntries(new FormData(f)));};
</script>
</body>
</html>
