<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>10 — transform</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>10 — transform</h1>
  <style>
  .a, .b { width:80px; height:80px; background:#1a4f8b; position:relative; margin:1rem; }
  .a { animation: top 1.2s ease-in-out infinite alternate; }
  .b { animation: tf 1.2s ease-in-out infinite alternate; }
  @keyframes top { to { top: 40px; } }
  @keyframes tf { to { transform: translateY(40px); } }
</style>
<p class="hint">Left animates <code>top</code> (layout). Right animates <code>transform</code> (composite).</p>
<div class="row"><div class="a"></div><div class="b"></div></div>
  
</body>
</html>
