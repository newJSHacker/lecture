<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>05 — line</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>05 — line</h1>
  <canvas id='c' width='640' height='360'></canvas><label>t <input id='t' type='range' min='-0.2' max='1.2' step='0.01' value='0.3'></label>
  <script>

function boot(draw){
  const c=document.getElementById('c'); const ctx=c.getContext('2d');
  function frame(){ ctx.clearRect(0,0,c.width,c.height); draw(ctx,c); }
  frame();
  document.querySelectorAll('input').forEach(el=>el.oninput=frame);
  return {ctx,c,frame};
}
function axes(ctx,c){
  ctx.save(); ctx.translate(0,c.height); ctx.scale(1,-1);
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(20,c.height-20); ctx.moveTo(20,40); ctx.lineTo(c.width-20,40); ctx.stroke();
  return ctx;
}

const tEl=document.getElementById('t');
boot((ctx,c)=>{
  const t=+tEl.value, A={x:80,y:80}, D={x:400,y:160};
  const p={x:A.x+t*D.x*0.4, y:A.y+t*D.y*0.4};
  ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#666'; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(A.x+D.x*0.5, A.y+D.y*0.5); ctx.stroke();
  ctx.fillStyle='#8f8'; ctx.beginPath(); ctx.arc(p.x,p.y,6,0,6.28); ctx.fill();
});

</script>
</body>
</html>
