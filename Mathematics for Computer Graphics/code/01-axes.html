<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>01 — axes</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>01 — axes</h1>
  <p class='hint'>Red = canvas y-down point. Cyan = flipped math y-up at the same numbers.</p><canvas id='c' width='640' height='360'></canvas>
  <script>

function boot(draw){
  const c=document.getElementById('c'); const ctx=c.getContext('2d');
  function frame(){ ctx.clearRect(0,0,c.width,c.height); draw(ctx,c); }
  frame();
  document.querySelectorAll('input').forEach(el=>el.oninput=frame);
  return {ctx,c,frame};
}
function axes(ctx,c){
  ctx.save(); ctx.translate(0,c.height); ctx.scale(1,-1);
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(20,c.height-20); ctx.moveTo(20,40); ctx.lineTo(c.width-20,40); ctx.stroke();
  return ctx;
}

const c=document.getElementById('c'), ctx=c.getContext('2d');
ctx.fillStyle='#222'; ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#f66'; ctx.fillRect(80,40,12,12);
ctx.save(); ctx.translate(0,c.height); ctx.scale(1,-1);
ctx.fillStyle='#6cf'; ctx.fillRect(80,40,12,12);
ctx.restore();

</script>
</body>
</html>
