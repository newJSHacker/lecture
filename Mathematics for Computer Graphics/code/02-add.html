<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>02 — add</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>02 — add</h1>
  <canvas id='c' width='640' height='360'></canvas><label>ax <input id='ax' type='range' min='-120' max='120' value='80'></label>
  <script>

function boot(draw){
  const c=document.getElementById('c'); const ctx=c.getContext('2d');
  function frame(){ ctx.clearRect(0,0,c.width,c.height); draw(ctx,c); }
  frame();
  document.querySelectorAll('input').forEach(el=>el.oninput=frame);
  return {ctx,c,frame};
}
function axes(ctx,c){
  ctx.save(); ctx.translate(0,c.height); ctx.scale(1,-1);
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(20,c.height-20); ctx.moveTo(20,40); ctx.lineTo(c.width-20,40); ctx.stroke();
  return ctx;
}

const axEl=document.getElementById('ax');
boot((ctx,c)=>{
  const ax=+axEl.value, ay=50, bx=40, by=90;
  ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height);
  ctx.translate(c.width/2,c.height/2); ctx.scale(1,-1);
  function arrow(x,y,col){ ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(x,y); ctx.stroke(); }
  arrow(ax,ay,'#6cf'); arrow(bx,by,'#fc6'); arrow(ax+bx,ay+by,'#8f8');
});

</script>
</body>
</html>
