<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>03 — dot</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>03 — dot</h1>
  <canvas id='c' width='640' height='360'></canvas><label>θ <input id='th' type='range' min='0' max='3.14' step='0.01' value='1'></label><pre id='out'></pre>
  <script>

function boot(draw){
  const c=document.getElementById('c'); const ctx=c.getContext('2d');
  function frame(){ ctx.clearRect(0,0,c.width,c.height); draw(ctx,c); }
  frame();
  document.querySelectorAll('input').forEach(el=>el.oninput=frame);
  return {ctx,c,frame};
}
function axes(ctx,c){
  ctx.save(); ctx.translate(0,c.height); ctx.scale(1,-1);
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(20,c.height-20); ctx.moveTo(20,40); ctx.lineTo(c.width-20,40); ctx.stroke();
  return ctx;
}

const thEl=document.getElementById('th'), out=document.getElementById('out');
boot((ctx,c)=>{
  const th=+thEl.value; const a={x:120,y:0}, b={x:120*Math.cos(th), y:120*Math.sin(th)};
  const d=a.x*b.x+a.y*b.y; const proj=(d/(a.x*a.x+a.y*a.y));
  ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height);
  ctx.translate(c.width/2,c.height/2); ctx.scale(1,-1);
  ctx.strokeStyle='#6cf'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(a.x,a.y); ctx.stroke();
  ctx.strokeStyle='#fc6'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(b.x,b.y); ctx.stroke();
  out.textContent='dot='+d.toFixed(1)+'  proj scale='+proj.toFixed(2);
});

</script>
</body>
</html>
