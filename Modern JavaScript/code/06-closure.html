<body>

  <h1>06 — closure</h1>
  <button id='b'>inc</button><pre id='out'></pre>
  <script>
function counter(){ let n=0; return ()=>++n; } const inc=counter(); b.onclick=()=>out.textContent=String(inc());
</script>
