<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>01 — canvas</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>01 — canvas</h1>
  <canvas id='c' width='640' height='320'></canvas>
  <script>
const c=document.getElementById('c'), ctx=c.getContext('2d'); ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle='#fc6'; ctx.fillRect(40,40,80,80); ctx.beginPath(); ctx.arc(300,160,50,0,6.28); ctx.fill();
</script>
</body>
</html>
