<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>09 — GSAP (local)</title>
  <link rel="stylesheet" href="demo.css"/>
  <style>
    .box { width: 48px; height: 48px; background: #1a4f8b; }
    @media (prefers-reduced-motion: reduce) {
      .box { transform: none !important; }
    }
  </style>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>09 — GSAP timeline (local file)</h1>
  <p class="hint">Loads <code>../vendor/gsap.min.js</code>. No CDN. If reduced motion is on, skip the tween.</p>
  <div class="box" id="box"></div>
  <button type="button" id="go">Play</button>
  <script src="../vendor/gsap.min.js"></script>
  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("go").onclick = () => {
      if (reduce || typeof gsap === "undefined") return;
      gsap.timeline()
        .to("#box", { x: 80, duration: 0.4 })
        .to("#box", { backgroundColor: "#c45c38", duration: 0.3 })
        .to("#box", { x: 0, duration: 0.4 });
    };
  </script>
</body>
</html>
