<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>02 onSegment</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>02 — onSegment</h1>
  <p class="hint">A–B is the segment. C is the query. Collinear is not enough: C must sit in the AABB of AB.</p>
  <button id="reset">Reset</button>
  <canvas id="c" width="800" height="520"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="viz.js"></script>
  <script>
    Viz.boot({
      points: [{x:160,y:280},{x:620,y:280},{x:390,y:160}],
      maxPoints: 3,
      labels: (i) => "ABC"[i],
      draw(ctx, s) {
        const [A,B,C] = s.points;
        Viz.segment(ctx, A, B, "#111", 3);
        Viz.box(ctx, CG.aabb([A,B]), "#888");
        if (C) Viz.dot(ctx, C, CG.onSegment(C,A,B) ? "#2ea05a" : "#c0392b", 7);
      },
      status(s) {
        const [A,B,C] = s.points;
        return [
          "orient(A,B,C) = " + CG.orient(A,B,C),
          "onSegment(C,A,B) = " + CG.onSegment(C,A,B),
          "Try: C between A and B, C beyond B, C off the line.",
        ].join("\n");
      }
    });
  </script>
</body>
</html>
