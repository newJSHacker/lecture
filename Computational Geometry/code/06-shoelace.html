<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>06 Shoelace</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>06 — Shoelace and polygon class</h1>
  <p class="hint">Click vertices in order. Same-turn test needs simplicity. Try a C-shape, then a bowtie.</p>
  <button id="reset">Reset</button>
  <button id="bow">Bowtie</button>
  <button id="hex">Convex hex</button>
  <canvas id="c" width="800" height="520"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="viz.js"></script>
  <script>
    const hex = [{x:400,y:80},{x:620,y:180},{x:620,y:360},{x:400,y:460},{x:180,y:360},{x:180,y:180}];
    const demo = Viz.boot({
      points: hex,
      draw(ctx, s) {
        if (s.points.length < 3) return;
        const kind = CG.classifyPolygon(s.points);
        const fill = kind === "convex" ? "rgba(46,160,90,0.25)" : kind === "simple-concave" ? "rgba(241,196,15,0.3)" : "rgba(192,57,43,0.3)";
        Viz.poly(ctx, s.points, fill);
      },
      status(s) {
        if (s.points.length < 3) return "Need ≥3 vertices.";
        const area = CG.shoelace(s.points);
        return [
          "class = " + CG.classifyPolygon(s.points),
          "signed area = " + area.toFixed(1) + (area > 0 ? "  (CCW)" : "  (CW)"),
          "allTurnsSame = " + CG.allTurnsSame(s.points),
          "proper self-intersection = " + CG.hasProperSelfIntersection(s.points),
        ].join("\n");
      }
    });
    document.getElementById("bow").onclick = () => demo.reset([{x:160,y:120},{x:640,y:400},{x:160,y:400},{x:640,y:120}]);
    document.getElementById("hex").onclick = () => demo.reset(hex);
  </script>
</body>
</html>
