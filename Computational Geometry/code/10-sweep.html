<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>10 Teaching sweep</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>10 — Teaching sweep</h1>
  <p class="hint">Same pairing as demo 09. Compare naive vs teaching sweep hit counts. Status is an array, not a BST.</p>
  <button id="reset">Reset</button>
  <button id="rand">Random 16</button>
  <canvas id="c" width="800" height="520"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="viz.js"></script>
  <script>
    function segsFrom(pts) {
      const segs = [];
      for (let i = 0; i + 1 < pts.length; i += 2) segs.push({ a: pts[i], b: pts[i+1] });
      return segs;
    }
    const demo = Viz.boot({
      points: [{x:60,y:120},{x:740,y:180},{x:80,y:400},{x:700,y:320},{x:200,y:40},{x:250,y:480},{x:480,y:40},{x:620,y:480}],
      draw(ctx, s) {
        const segs = segsFrom(s.points);
        segs.forEach((sg) => Viz.segment(ctx, sg.a, sg.b, "#333", 2));
        CG.teachingSweep(segs).forEach((h) => {
          if (h.point) Viz.dot(ctx, h.point, "#8e44ad", 5);
        });
      },
      status(s) {
        const segs = segsFrom(s.points);
        const t0 = performance.now();
        const naive = CG.naiveSegmentIntersections(segs);
        const t1 = performance.now();
        const sweep = CG.teachingSweep(segs);
        const t2 = performance.now();
        return [
          "n = " + segs.length,
          "naive hits = " + naive.length + "  (" + (t1-t0).toFixed(2) + " ms)",
          "sweep hits = " + sweep.length + "  (" + (t2-t1).toFixed(2) + " ms)",
          "If I is huge, sweep cannot beat Θ(n²) output.",
        ].join("\n");
      }
    });
    document.getElementById("rand").onclick = () => {
      const pts = [];
      for (let i = 0; i < 32; i++) pts.push({ x: 50 + Math.random()*700, y: 40 + Math.random()*440 });
      demo.reset(pts);
    };
  </script>
</body>
</html>
