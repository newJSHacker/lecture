<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>11 Ear clipping</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>11 — Ear clipping</h1>
  <p class="hint">Simple polygon vertices in order. n − 2 triangles. Reflex vertices are never ear tips.</p>
  <button id="reset">Reset C-shape</button>
  <button id="convex">Convex</button>
  <canvas id="c" width="800" height="520"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="viz.js"></script>
  <script>
    const Cshape = [
      {x:120,y:80},{x:680,y:80},{x:680,y:440},{x:120,y:440},
      {x:120,y:340},{x:540,y:340},{x:540,y:180},{x:120,y:180}
    ];
    Viz.boot({
      points: Cshape,
      draw(ctx, s) {
        const tris = CG.earClip(s.points);
        const pal = ["rgba(46,160,90,0.35)","rgba(26,79,139,0.28)","rgba(241,196,15,0.35)","rgba(142,68,173,0.28)"];
        tris.forEach((t, i) => Viz.poly(ctx, t, pal[i % pal.length], "#333"));
      },
      status(s) {
        const n = s.points.length;
        const tris = CG.earClip(s.points);
        return [
          "n = " + n,
          "triangles = " + tris.length + "  (expect " + Math.max(0, n-2) + ")",
          "class = " + CG.classifyPolygon(s.points),
          "If triangle count is short, the polygon is not simple or numeric garbage.",
        ].join("\n");
      }
    });
    document.getElementById("convex").onclick = () => Viz._last.reset([
      {x:400,y:60},{x:680,y:180},{x:620,y:420},{x:280,y:460},{x:120,y:260}
    ]);
  </script>
</body>
</html>
