<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>14 Discrete Voronoi</title>
  <link rel="stylesheet" href="demo.css"/>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>14 — Discrete Voronoi</h1>
  <p class="hint">Each pixel (downsampled) takes the nearest site. Not Fortune. Hull sites have unbounded cells.</p>
  <button id="reset">Reset</button>
  <canvas id="c" width="800" height="520"></canvas>
  <pre id="out"></pre>
  <script src="kernel.js"></script>
  <script src="viz.js"></script>
  <script>
    const pal = ["#f4d6d6","#d6eaf4","#d5f5e3","#f9e79f","#e8daef","#fdebd0","#d0ece7","#fadbd8"];
    Viz.boot({
      points: [{x:180,y:140},{x:520,y:120},{x:400,y:320},{x:220,y:400},{x:640,y:380}],
      draw(ctx, s) {
        const step = 8;
        const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
        const d = img.data;
        for (let y = 0; y < ctx.canvas.height; y += step) {
          for (let x = 0; x < ctx.canvas.width; x += step) {
            const site = CG.nearestSite({x, y}, s.points);
            const idx = s.points.indexOf(site);
            const col = pal[idx % pal.length];
            const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
            for (let dy = 0; dy < step; dy++) for (let dx = 0; dx < step; dx++) {
              const i = ((y+dy) * ctx.canvas.width + (x+dx)) * 4;
              d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
            }
          }
        }
        ctx.putImageData(img, 0, 0);
        const hull = CG.andrew(s.points);
        Viz.poly(ctx, hull, null, "rgba(0,0,0,0.45)");
      },
      status(s) {
        return "sites = " + s.points.length + "\nhull sites (unbounded cells) = " + CG.andrew(s.points).length + "\nEmpty-circle: a Voronoi vertex is a circumcenter with no site inside.";
      }
    });
  </script>
</body>
</html>
